version: 2
# Minor and patch updates come grouped, one PR per ecosystem; each major update gets its own PR,
# so a breaking one never holds back the safe ones.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: monthly }
    groups:
      backend-packages:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups:
      frontend-packages:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
  # GitHub Actions, devkit included: weekly, so a new deploy version arrives within a week.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions-packages:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
