version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly }
  # GitHub Actions, inclusive o devkit: todo dia, para versão nova do deploy chegar logo.
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: daily }
