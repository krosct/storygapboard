name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled; runs on main never are, so a
# deploy is never interrupted halfway (newer main runs wait in the queue).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m unittest discover -s tests -t . -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit && pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  run:
    name: Local run smoke test (./deploy.sh local)
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The DEV command of deploy.conf, as "deploy.sh local" of devkit runs it on a developer
      # machine (without a .env: every setting has a default). The job keeps its name because
      # it is a required check on main.
      - name: Start the app
        run: |
          bash -c "$(sed -n 's/^DEV="\(.*\)"$/\1/p' deploy.conf)" > run.log 2>&1 &
          for _ in $(seq 1 180); do
            curl -fsS http://localhost:8080/api/health && exit 0
            sleep 1
          done
          cat run.log
          exit 1
      - name: Smoke test
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<title>StoryGapBoard</title>'
          curl -fsS -D - -o /dev/null http://localhost:8080/ | grep -qi '^content-security-policy:'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/docs)" = 404
          curl -fsS http://localhost:8080/api/meta | grep -q '"layouts"'
      - if: failure()
        run: cat run.log

  deploy:
    name: Deploy to production
    needs: [backend, frontend, audit, run]
    # Published by devkit (krosct/devkit, pinned version) from deploy.conf: it builds the frontend here, sends
    # the release over SSH, rolls back if it does not stay up and checks the public address.
    # Enable with the REPOSITORY variable DEPLOY_ENABLED=true (job conditions cannot see
    # environment variables). Secrets and variables live in the "vars" environment; the list
    # is in the README ("Deploy").
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: vars
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      # BUILD (deploy.conf) runs on the runner: the server needs no Node.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: krosct/devkit@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT || '22' }}
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          path: ${{ secrets.DEPLOY_PATH || vars.DEPLOY_PATH }}
          domain: ${{ secrets.DEPLOY_SITE_ADDRESS || vars.DEPLOY_SITE_ADDRESS }}
          origin-cert: ${{ secrets.DEPLOY_ORIGIN_CERT }}
          origin-key: ${{ secrets.DEPLOY_ORIGIN_KEY }}
          preserve: ${{ secrets.DEPLOY_PRESERVE || vars.DEPLOY_PRESERVE }}
          # App settings (.env on the server), each from a secret or variable DEPLOY_<KEY>. An
          # unset one is removed from the server's .env and the app uses its default.
          env: |
            RATE_API_PER_MINUTE=${{ secrets.DEPLOY_RATE_API_PER_MINUTE || vars.DEPLOY_RATE_API_PER_MINUTE }}
            RATE_GENERATE_PER_MINUTE=${{ secrets.DEPLOY_RATE_GENERATE_PER_MINUTE || vars.DEPLOY_RATE_GENERATE_PER_MINUTE }}
            RATE_GENERATE_PER_DAY=${{ secrets.DEPLOY_RATE_GENERATE_PER_DAY || vars.DEPLOY_RATE_GENERATE_PER_DAY }}
            MAX_JOBS_PER_CLIENT=${{ secrets.DEPLOY_MAX_JOBS_PER_CLIENT || vars.DEPLOY_MAX_JOBS_PER_CLIENT }}
            MAX_CONCURRENT_JOBS=${{ secrets.DEPLOY_MAX_CONCURRENT_JOBS || vars.DEPLOY_MAX_CONCURRENT_JOBS }}
            AUTH_FAILURES_BEFORE_LOCK=${{ secrets.DEPLOY_AUTH_FAILURES_BEFORE_LOCK || vars.DEPLOY_AUTH_FAILURES_BEFORE_LOCK }}
            AUTH_FAILURE_WINDOW_S=${{ secrets.DEPLOY_AUTH_FAILURE_WINDOW_S || vars.DEPLOY_AUTH_FAILURE_WINDOW_S }}
            AUTH_LOCK_S=${{ secrets.DEPLOY_AUTH_LOCK_S || vars.DEPLOY_AUTH_LOCK_S }}
            JOB_TTL_S=${{ secrets.DEPLOY_JOB_TTL_S || vars.DEPLOY_JOB_TTL_S }}
            MAX_STORED_JOBS=${{ secrets.DEPLOY_MAX_STORED_JOBS || vars.DEPLOY_MAX_STORED_JOBS }}
