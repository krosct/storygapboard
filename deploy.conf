# StoryGapBoard's specifics for devkit (https://github.com/krosct/devkit), which does everything
# else: running it here (deploy.sh local), publishing to the VPS (deploy.sh vps HOST) and CI deploys.
APP=storygapboard
# Local: backend venv + built frontend, then the app alone on http://localhost:8080.
DEV="uv venv -q --allow-existing .venv --python 3.12 && uv pip install -q --python .venv/bin/python -r backend/requirements-dev.txt && (cd frontend && npm ci --no-audit --no-fund --loglevel=error && npm run build) && exec .venv/bin/uvicorn --app-dir backend app.main:app --host 127.0.0.1 --port 8080 --workers 1 --no-server-header --no-access-log"
# On this machine or the CI runner, before packaging: the server needs no Node.
BUILD="cd frontend && npm ci --no-audit --no-fund && npm run build"
INCLUDE="frontend/dist"
INSTALL="uv venv .venv --python 3.12 && uv pip install --python .venv/bin/python -r backend/requirements.txt"
# One worker: rate limits and jobs live in memory. Client IPs come from the shared Caddy
# (X-Forwarded-For), trusted only from 127.0.0.1.
RUN=".venv/bin/uvicorn --app-dir backend app.main:app --host 127.0.0.1 --port {port} --workers 1 --proxy-headers --forwarded-allow-ips 127.0.0.1 --no-server-header --no-access-log --timeout-keep-alive 5 --limit-concurrency 200"
HEALTH=/api/health
# Nothing is required: every setting has a default (backend/app/settings.py).
# Salt of the hashed ids in the generation log: generated once, kept across deploys.
PRESERVE="LOG_HASH_SALT"
SERVICE_ENV="DATA_DIR={data} FRONTEND_DIST={root}/current/frontend/dist PUBLIC_URL={url} PYTHONUNBUFFERED=1"
# CI: the app settings come from the "env" input of the deploy job (.github/workflows/ci-cd.yml).
