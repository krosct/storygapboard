# Production stack (also used by `./deploy.sh local`): the app container is
# never published; only Caddy (TLS, compression, body cap) faces the network.
name: storygapboard

services:
  app:
    build:
      context: .
      # Build steps (npm/pip) use the host network: immune to Docker bridge
      # subnets that shadow the host's DNS servers.
      network: host
    image: storygapboard-app:latest
    restart: unless-stopped
    # Optional DNS override (empty = Docker default). ./deploy.sh local sets it
    # automatically when containers cannot resolve names on this machine.
    dns: ${APP_DNS:-}
    env_file:
      - path: .env
        required: false
    environment:
      DATA_DIR: /data
      # Caddy reaches the app over the private Docker network and always
      # rewrites X-Forwarded-For with the real client address.
      FORWARDED_ALLOW_IPS: "172.16.0.0/12,10.0.0.0/8,192.168.0.0/16"
    volumes:
      - app-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (your domain)}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  app-data:
  caddy-data:
  caddy-config:
